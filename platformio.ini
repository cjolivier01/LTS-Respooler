[platformio]
default_envs = control_board_v4

[env]
; Pinned for reproducible installs. This is Arduino-ESP32 3.3.8 / ESP-IDF 5.5.4,
; the patch-compatible successor to the 3.3.1 / 5.5.1 release used by v1.2.1.
; Unlike that older platform package, it also supports PlatformIO on Python 3.14.
platform = https://github.com/pioarduino/platform-espressif32.git#669bcf7e390745eb0bd507e74db96b805c633692
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = min_spiffs.csv
lib_deps =
  teemuatlut/TMCStepper @ 0.7.3
  h2zero/NimBLE-Arduino @ 2.3.7
  bblanchon/ArduinoJson @ 6.21.5
  adafruit/Adafruit NeoPixel @ 1.15.2

; LTS Control Board V4/V4.1: ESP32-S3-WROOM-1, 4 MB flash, no PSRAM.
[env:control_board_v4]
board = esp32-s3-devkitc-1
build_src_filter =
  +<control_board/>
upload_speed = 921600
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

; LTS Driver Board V1: ESP32-WROOM-32, 4 MB flash.
[env:driver_board_v1]
board = esp32dev
build_src_filter =
  +<driver_board/>
upload_speed = 460800
